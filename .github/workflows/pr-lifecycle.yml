name: PR Lifecycle Tracker

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  track-lifecycle:
    name: Log PR Event
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print Pull Request Details
        run: |
          echo "=========================================="
          echo "🚀 Event Type Fired: ${{ github.event.action }}"
          echo "📝 PR Title:         ${{ github.event.pull_request.title }}"
          echo "👤 PR Author:        ${{ github.event.pull_request.user.login }}"
          echo "🌿 Source Branch:    ${{ github.event.pull_request.head.ref }}"
          echo "🎯 Target Branch:    ${{ github.event.pull_request.base.ref }}"
          echo "=========================================="

      - name: Execute on Merge Only
        if: github.event.action == 'closed' && github.event.pull_request.merged == true
        run: |
          echo "🎉 SUCCESS: Pull request #${{ github.event.pull_request.number }} was successfully merged!"
          echo "Merged into target branch: ${{ github.event.pull_request.base.ref }}"
