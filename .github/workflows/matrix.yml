name: Python Matix

on:
  workflow_dispatch:

jobs:
  python-test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'

        os:
          - ubuntu-latest
          - windows-latest

        exclude:
          - python-version: '3.10'
            os: windows-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}


      - name: Print Python Version
        run: python --version

      - name: Intentional failure
        if: matrix.python-version == '3.11' && matrix.os == 'ubuntu-latest'
        run: exit 1

