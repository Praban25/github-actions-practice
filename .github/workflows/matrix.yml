name: Python Matix

on:
  workflow_dispatch:

jobs:
  python-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'

    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}


      - name: Print Python Version
        run: python --version

